[Service]
# The remoteproc state changes to "running" before the SLPI sensors-PD can be
# opened reliably. Starting FastRPC immediately leaves SSC QMI unregistered
# for the rest of that boot; a delayed start is reproducibly healthy.
ExecStartPre=/usr/bin/sleep 15
Environment="hexagonrpcd_device=/dev/fastrpc-sdsp"
Environment="hexagonrpcd_dsp=sdsp"
Environment="hexagonrpcd_fw_dir=/lib/firmware/hexagonfs"
Environment="hexagonrpcd_extra=-s"
