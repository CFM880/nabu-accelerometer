# Nabu's sensors are owned by SLPI and exposed through SSC over QRTR.
[Unit]
Wants=hexagonrpcd.service
After=hexagonrpcd.service
# The proxy can crash once per SLPI reset (e.g. a resume crash) and may do so
# repeatedly while the SLPI is restarting; allow that instead of hitting the
# default start limit and giving up.
StartLimitIntervalSec=120
StartLimitBurst=20

[Service]
ExecStart=
ExecStart=/usr/local/libexec/iio-sensor-proxy-ssc
RestrictAddressFamilies=AF_UNIX AF_LOCAL AF_NETLINK AF_QIPCRTR
# When the SLPI resets underneath it the proxy segfaults (status=11/SEGV) and,
# without this, stays failed; restart it so the light/compass path recovers.
Restart=on-failure
RestartSec=2
